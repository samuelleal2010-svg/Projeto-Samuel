<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f1fb">
    <title>Gráfico de Vendas da Empresa</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background: #f4f1fb;
            color: #29213b;
            font-family: Arial, sans-serif;
        }

        .painel {
            width: min(900px, 100%);
            padding: 30px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(48, 25, 80, .12);
        }

        h1 {
            margin: 0 0 8px;
            color: #592c91;
            text-align: center;
        }

        .subtitulo {
            margin: 0 0 28px;
            color: #766b83;
            text-align: center;
        }

        .grafico {
            position: relative;
            display: flex;
            align-items: end;
            gap: clamp(10px, 3vw, 28px);
            height: 390px;
            padding: 20px 15px 42px 58px;
            border-bottom: 2px solid #766b83;
            border-left: 2px solid #766b83;
            background: repeating-linear-gradient(
                to top,
                transparent 0,
                transparent 74px,
                #eee9f5 75px,
                #eee9f5 76px
            );
        }

        .eixo-y {
            position: absolute;
            top: 50%;
            left: -52px;
            color: #62566f;
            font-weight: bold;
            writing-mode: vertical-rl;
            transform: translateY(-50%) rotate(180deg);
        }

        .coluna {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: end;
            gap: 8px;
            height: 100%;
            min-width: 0;
        }

        .valor {
            color: #4c2878;
            font-size: clamp(12px, 2vw, 16px);
            font-weight: bold;
            white-space: nowrap;
        }

        .barra {
            width: min(100%, 105px);
            height: var(--altura);
            min-height: 8px;
            border-radius: 10px 10px 0 0;
            background: linear-gradient(180deg, #bd8bf2, #743bb4);
            transition: filter .2s, transform .2s;
        }

        .barra:hover {
            filter: brightness(1.08);
            transform: scaleY(1.03);
            transform-origin: bottom;
        }

        .mes {
            position: absolute;
            bottom: -30px;
            color: #51445f;
            font-weight: bold;
        }

        .legenda {
            margin-top: 55px;
            color: #6f637b;
            text-align: center;
        }

        .resumo {
            margin-top: 22px;
            padding: 15px;
            border-radius: 12px;
            background: #f5effd;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 520px) {
            .painel {
                padding: 22px 16px;
            }

            .grafico {
                height: 320px;
                gap: 8px;
                padding-left: 42px;
            }

            .eixo-y {
                left: -38px;
                font-size: 12px;
            }

            .mes {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="painel">
        <h1>Vendas da Empresa</h1>
        <p class="subtitulo">Desempenho mensal — valores fictícios</p>

        <section class="grafico" aria-label="Gráfico de barras das vendas mensais">
            <span class="eixo-y">Vendas (R$ mil)</span>

            <div class="coluna">
                <span class="valor">R$ 20 mil</span>
                <div class="barra" style="--altura: 40%" title="Janeiro: R$ 20 mil"></div>
                <span class="mes">Jan</span>
            </div>
            <div class="coluna">
                <span class="valor">R$ 25 mil</span>
                <div class="barra" style="--altura: 50%" title="Fevereiro: R$ 25 mil"></div>
                <span class="mes">Fev</span>
            </div>
            <div class="coluna">
                <span class="valor">R$ 30 mil</span>
                <div class="barra" style="--altura: 60%" title="Março: R$ 30 mil"></div>
                <span class="mes">Mar</span>
            </div>
            <div class="coluna">
                <span class="valor">R$ 35 mil</span>
                <div class="barra" style="--altura: 70%" title="Abril: R$ 35 mil"></div>
                <span class="mes">Abr</span>
            </div>
            <div class="coluna">
                <span class="valor">R$ 40 mil</span>
                <div class="barra" style="--altura: 80%" title="Maio: R$ 40 mil"></div>
                <span class="mes">Mai</span>
            </div>
        </section>

        <p class="legenda">■ Vendas mensais</p>
        <div class="resumo">
            <strong>Resumo:</strong> as vendas cresceram de R$ 20 mil em janeiro
            para R$ 40 mil em maio, um aumento de 100% no período.
        </div>
    </main>
</body>
</html>
