  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Pontos</title>

    <style>
        body {
            background: #17172e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #00e5ff;
        }

        #jogo {
            width: 90%;
            max-width: 600px;
            height: 350px;
            background: #29294d;
            margin: 20px auto;
            position: relative;
            border: 3px solid #00e5ff;
            border-radius: 15px;
            overflow: hidden;
            cursor: crosshair;
        }

        #alvo {
            width: 50px;
            height: 50px;
            background: #ff3366;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            display: none;
        }

        button {
            background: #00e5ff;
            color: #17172e;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        #mensagem {
            color: #00e5ff;
        }
    </style>
</head>

<body>

    <h1>🎮 Jogo dos Pontos</h1>

    <h2>Pontos: <span id="pontos">0</span></h2>
    <h2>❤️ Vidas: <span id="vidas">3</span></h2>
    <h3>Tempo: ∞ Infinito</h3>
    <h3>Dificuldade: <span id="dificuldade">Normal</span></h3>

    <button onclick="iniciar()">Começar jogo</button>

    <div id="jogo">
        <div id="alvo"></div>
    </div>

    <h2 id="mensagem">Clique em começar!</h2>

    <script>
        let pontos = 0;
        let vidas = 3;
        let jogando = false;

        let inicio;
        let cronometroAlvo;

        const alvo = document.getElementById("alvo");
        const jogo = document.getElementById("jogo");

        function iniciar() {
            clearTimeout(cronometroAlvo);

            pontos = 0;
            vidas = 3;
            jogando = true;

            inicio = Date.now();

            document.getElementById("pontos").textContent = pontos;
            document.getElementById("vidas").textContent = vidas;
            document.getElementById("dificuldade").textContent = "Normal";
            document.getElementById("mensagem").textContent =
                "Boa sorte! Acerte os alvos!";

            alvo.style.display = "block";

            moverAlvo();
        }

        function acertar() {
            if (!jogando) return;

            clearTimeout(cronometroAlvo);

            pontos++;

            document.getElementById("pontos").textContent = pontos;

            moverAlvo();
        }

        function errar() {
            if (!jogando) return;

            clearTimeout(cronometroAlvo);

            vidas--;

            document.getElementById("vidas").textContent = vidas;

            if (vidas <= 0) {
                fimDeJogo();
            } else {
                moverAlvo();
            }
        }

        function moverAlvo() {
            if (!jogando) return;

            clearTimeout(cronometroAlvo);

            let x = Math.random() * (jogo.clientWidth - 50);
            let y = Math.random() * (jogo.clientHeight - 50);

            alvo.style.left = x + "px";
            alvo.style.top = y + "px";
            alvo.style.display = "block";

            // A cada minuto, o alvo fica mais rápido
            let minutos = Math.floor((Date.now() - inicio) / 60000);

            // Começa com 2,5 segundos e diminui 0,3 segundo por minuto
            // O limite mínimo é 0,5 segundo
            let duracao = Math.max(500, 2500 - minutos * 300);

            if (minutos === 0) {
                document.getElementById("dificuldade").textContent = "Normal";
            } else if (minutos < 3) {
                document.getElementById("dificuldade").textContent = "Difícil";
            } else {
                document.getElementById("dificuldade").textContent = "Extrema";
            }

            cronometroAlvo = setTimeout(() => {
                if (!jogando) return;

                vidas--;

                document.getElementById("vidas").textContent = vidas;

                if (vidas <= 0) {
                    fimDeJogo();
                } else {
                    moverAlvo();
                }

            }, duracao);
        }

        function fimDeJogo() {
            jogando = false;

            clearTimeout(cronometroAlvo);

            alvo.style.display = "none";

            document.getElementById("mensagem").textContent =
                "💀 GAME OVER! Você fez " + pontos + " pontos!";
        }

        alvo.addEventListener("click", function(event) {
            event.stopPropagation();
            acertar();
        });

        jogo.addEventListener("click", function(event) {
            if (event.target !== alvo) {
                errar();
            }
        });

    </script>

</body>
</html>
